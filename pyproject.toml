[project]
name = "rt-detrv4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "calflops>=0.3.2",
    "faster-coco-eval>=1.7.2",
    "ftfy>=6.3.1",
    "omegaconf>=2.3.1",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "submitit>=1.5.4",
    "tensorboard>=2.21.0",
    "termcolor>=3.3.0",
    "torch>=2.13.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "wandb>=0.28.2",
]

[project.scripts]
